<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./assets/snake_icon.ico">
</head>

<body>
    <div>
        <audio id="music" loop>
            <source src="./assets/ES_Pop a Can of That Funky Jam - Peachwood.mp3" type="audio/mpeg">
        </audio>
        <div class="media_controls" id="media_controls" style="display: none;">
            <button id="play_pause" class="control_button">
                <span id="music_button-text">MUSIC</span>
            </button>
            <button id="theme_toggle" class="control_button">
                <span id="theme_toggle-value">Classic</span>
            </button>
            <button id="pause_game" class="control_button">
                <span id="pause_game-text">PAUSE</span>
            </button>
            <button id="reset_game" class="control_button">
                <span>RESET</span>
            </button>
        </div>

        <audio id="eating_sf">
            <source src="./assets/eating-sound-effect-36186.mp3" type="audio/mpeg">
        </audio>
        <audio id="gameover_sf">
            <source src="./assets/falled-sound-effect-278635.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="game">
        <h1>WELCOME TO SNAKE</h1>
        <div class="score_bar">
            <h3>Score:</h3>
            <h3 id="score_num"></h3>
        </div>
        <div class="score_bar">
            <h3>Highscore:</h3>
            <h3 id="highscore_num"></h3>
        </div>
        <canvas id="canvas">

        </canvas>
    </div>
    <div class="popup_screen" id="pause_screen">
        <h1>PAUSED</h1>
    </div>
    <div class="popup_screen" id="gameover_screen">
        <h1>GAME OVER!</h1>
        <h2>BETTER LUCK NEXT TIME</h2>
    </div>

    <div class="welcome_bubble">
        <h2>Welcome to my rendition of the classic game, SNAKE!</h2>
        <h3>Controls:</h3>
        <h4>Movement = WASD, Arrow Keys or Swipe (touchscreen)</h4>
        <h4>Pause = Spacebar or Escape</h4>
        <button id="start" class="snake_button">Start Game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
